plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
    id 'io.freefair.lombok' version "9.1.0"
    id 'maven-publish'
}

base {
    archivesName = "${mod_name} Fabric ${minecraft_version}"
}

repositories {
    maven { url 'https://maven.covers1624.net/' }
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated true
            programArgs '--launch_target', 'net.fabricmc.loader.impl.launch.knot.KnotClient'
            mainClass.set 'net.covers1624.devlogin.DevLogin'
        }
    }

}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    //Dev Login
    localRuntime 'net.covers1624:DevLogin:0.1.0.5'
}

processResources {
    var expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "pack_format": pack_format,
            "fabric_version": fabric_version,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "credits": credits,
    ]

    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}