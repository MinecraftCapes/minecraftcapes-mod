buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://maven.minecraftforge.net" }
        maven { url 'https://repo.spongepowered.org/maven'}
    }
    dependencies {
        classpath("net.minecraftforge.gradle:ForgeGradle:2.2-SNAPSHOT")
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "2.0.4"
    id "io.freefair.lombok" version "2.9.5"
}

repositories {
    maven {
        url = "https://repo.spongepowered.org/maven/"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: 'org.spongepowered.mixin'

// These settings allow you to choose what version of Java you want to be compatible with. Forge 1.7.10 runs on Java 6 to 8.
sourceCompatibility = targetCompatibility = 1.8

version = "${project.version}"
group = "net.minecraftcapes" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "${project.mod_name} Forge ${project.minecraft_version}"

minecraft {
    version = "${minecraft_version}-${forge_version}-${minecraft_version}"

    replace '@MOD_VERSION', project.version
    replace '@MINECRAFT_VERSION', project.minecraft_version
    replaceIn 'MinecraftCapes.java'

    runDir = "run"
    mappings = "stable_26"
    makeObfSourceJar = false
}

// This is the configuration for the shadow plugin, which is used to add libraries to the jar.
configurations {
    shade
    compile.extendsFrom(shade)
}

def systemOs = System.getProperty("os.name").toLowerCase(Locale.ENGLISH)

dependencies {
    shade('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
        exclude module: 'log4j-core'
    }

    annotationProcessor 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
}

jar {
    manifest.attributes (
        "FMLCorePlugin": "net.minecraftcapes.mixin.MixinLoader",
        'FMLCorePluginContainsFMLMod': true,
        'ForceLoadAsMod': true,
        "TweakOrder": 0,
        'TweakClass': 'net.minecraftcapes.spongepowered.asm.launch.MixinTweaker',
    )
}

processResources {
    // Fill in data
    def expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "pack_format": pack_format,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "credits": credits,
            "java_version": java_version
    ]

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

sourceSets {
    main {
        ext.refMap = "${mod_id}.refmap.json"
    }
}

runClient {
    args("--username=james090500")
}

// This is the configuration for the shadow plugin, which is used to add libraries to the jar.
shadowJar {
    configurations = [project.configurations.shade]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    classifier ""

    relocate 'org.spongepowered', 'net.minecraftcapes.spongepowered'

    mergeServiceFiles {
        include 'META-INF/services/*'
    }
}

reobf {
    shadowJar { }
}