plugins {
    id "dev.architectury.loom" version "1.13-SNAPSHOT"
    id "dev.architectury.architectury-pack200" version "0.1.3"
}

base {
    archivesName = "${project.mod_name} Forge ${project.minecraft_version}"
}

version = project.version
group = "net.minecraftcapes"

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
}

loom {
    silentMojangMappingsLicense()

    forge {
        net.fabricmc.loom.extension.ForgeExtensionImpl.
        //pack200Provider.set(dev.architectury.pack200.java.Pack200Adapter())

        mixinConfigs = [
                "${project.mod_id}.mixins.json"
        ]
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    //mappings loom.officialMojangMappings()

    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}-${project.minecraft_version}"
}

