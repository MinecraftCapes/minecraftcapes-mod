import dev.architectury.pack200.java.Pack200Adapter
import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id "gg.essential.loom" version "1.11.37+"
    id "com.gradleup.shadow" version "9.2.2"
    id "io.freefair.lombok" version "9.1.0"
}

base {
    archivesName = "${project.mod_name} Forge ${project.minecraft_version}"
}

version = project.version
group = "net.minecraftcapes"

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

loom {
    // Silence mappings license warning
    silentMojangMappingsLicense()

    //Runs must be done via the "Application" called "Minecraft Client" not gradlew
    //<option name="PROGRAM_PARAMETERS" value="--username=james090500 --tweakClass=org.spongepowered.asm.launch.MixinTweaker" />

            // Forge
    forge {
        // Forge extractor for legacy versions
        pack200Provider = new Pack200Adapter()

        // Mixins
        mixinConfigs = [
            "${project.mod_id}.mixins.json"
        ]
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
}

configurations {
    implementation.extendsFrom(shadowImpl)
}

repositories {
    maven {url = "https://repo.spongepowered.org/maven/" }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Mappings
    mappings "de.oceanlabs.mcp:mcp_stable:22-1.8.9"

    // Forge
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}-${project.minecraft_version}"

    // Mixin
    shadowImpl ("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        transitive = false
    }
    //annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT")
}

jar {
    // Setup Mixin
    manifest.attributes (
        "FMLCorePlugin": "net.minecraftcapes.mixin.MixinLoader",
        'FMLCorePluginContainsFMLMod': true,
        'ForceLoadAsMod': true,
        "TweakOrder": 0,
        'TweakClass': 'net.minecraftcapes.spongepowered.asm.launch.MixinTweaker',
    )
}

processResources {
    // Fill in data
    def expandProps = [
        "version": version,
        "group": project.group, //Else we target the task's group.
        "minecraft_version": minecraft_version,
        "mod_name": mod_name,
        "mod_author": mod_author,
        "mod_id": mod_id,
        "license": license,
        "description": project.description,
        "forge_version": forge_version,
        "forge_loader_version_range": forge_loader_version_range,
        "credits": credits,
        "java_version": java_version
    ]

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

shadowJar {
    configurations = [project.configurations.shadowImpl]
    archiveClassifier.set('deobf')
    relocate 'org.spongepowered', 'net.minecraftcapes.spongepowered'
}

remapJar {
    from shadowJar
    inputFile.set(tasks.shadowJar.archiveFile)
}

assemble {
    dependsOn remapJar
}