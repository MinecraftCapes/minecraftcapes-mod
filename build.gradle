plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.15-SNAPSHOT'
	id 'ploceus' version '1.15-SNAPSHOT'
	id 'io.freefair.lombok' version "9.2.0"
}

base {
	archivesName = "${mod_name} Ornithe ${minecraft_version}"
}

version = project.version
group = project.group

ploceus {
	setIntermediaryGeneration(2)
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	runs {
		client {
			client()
			programArgs(["--username", "james090500"])
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)
	exceptions ploceus.raven(project.raven_build)
	signatures ploceus.sparrow(project.sparrow_build)
	nests ploceus.nests(project.nests_build)

	ploceus.dependOsl(project.osl_version)

	// Third party mods
	//modImplementation "maven.modrinth:modmenu-ornithe:0.3.1+mcb1.7.3"
	//modImplementation "maven.modrinth:legacyauth:1.0.5+Protocol14-Client"
}

processResources {
	def expandProps = [
			"version": version,
			"group": project.group, //Else we target the task's group.
			"minecraft_version": minecraft_version,
			"mod_name": mod_name,
			"mod_author": mod_author,
			"mod_id": mod_id,
			"license": license,
			"description": project.description,
			"credits": credits,
	]

	filesMatching('fabric.mod.json') {
		expand expandProps
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 8
}

java {
	// Still required by IDEs such as Eclipse and Visual Studio Code
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

// If you plan to use a different file for the license, don't forget to change the file name here!
jar {
	from('LICENSE') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}