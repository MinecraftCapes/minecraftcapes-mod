plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'fabric-loom' version "${fabric_loom_version}"
    id 'io.freefair.lombok' version "9.1.0"
    id 'maven-publish'
}

base {
    archivesName = "${mod_name} Fabric ${minecraft_version}"
}

repositories {
    maven { url 'https://maven.covers1624.net/' }
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated true
            programArgs '--launch_target', 'net.fabricmc.loader.impl.launch.knot.KnotClient'
            mainClass.set 'net.covers1624.devlogin.DevLogin'
        }
    }

}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    //Dev Login
    localRuntime 'net.covers1624:DevLogin:0.1.0.5'
}

processResources {
    var expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "pack_format": pack_format,
            "fabric_version": fabric_version,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "credits": credits,
    ]

    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

def releaseType = providers.environmentVariable('RELEASE_TYPE').getOrElse('ALPHA')

publishMods {
    file = tasks.named('renameJar').flatMap { it.output }
    version = "forge-${minecraft_version}-${version}"
    displayName = "MinecraftCapes Forge ${minecraft_version}-${version}"
    // Jenkins skips publishing for NO_DEPLOY; Gradle still needs a valid enum to configure the build.
    type = releaseType == 'NO_DEPLOY' ? 'ALPHA' : releaseType
    changelog = ''
    modLoaders.add('forge')

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = '359836'
        minecraftVersions.add(minecraft_version)
        client = true
        server = false
        requires('mixinbootstrap')
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = '9gNVPfzw'
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_ONLY
        requires('mixinbootstrap')
    }
}
