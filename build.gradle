plugins {
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
	id 'fabric-loom' version '1.17.20'
	id 'babric-loom-extension' version '1.17.4'
	id 'io.freefair.lombok' version "9.2.0"
}

base {
	archivesName = "${mod_name} Babric ${minecraft_version}"
}

repositories {
	maven {
		url = "https://maven.glass-launcher.net/snapshots/"
	}
	maven {
		url = "https://maven.glass-launcher.net/releases/"
	}
	maven {
		url = "https://maven.glass-launcher.net/babric"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.glasslauncher:biny:b1.7.3+e0778a3:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation("org.apache.logging.log4j:log4j-core:2.17.2")

	implementation("org.slf4j:slf4j-api:1.8.0-beta4")
	implementation("org.apache.logging.log4j:log4j-slf4j18-impl:2.17.1")
}

loom {
	runs {
		client {
			getProgramArguments().addAll(["--username", "james090500"])
		}
	}
}

processResources {
	def expandProps = [
			"version": version,
			"group": project.group, //Else we target the task's group.
			"minecraft_version": minecraft_version,
			"mod_name": mod_name,
			"mod_author": mod_author,
			"mod_id": mod_id,
			"license": license,
			"description": project.description,
			"credits": credits,
	]

	filesMatching('fabric.mod.json') {
		expand expandProps
	}
}

java {
	//toolchain.languageVersion = JavaLanguageVersion.of(8)
	sourceCompatibility = targetCompatibility = 17
}

def releaseType = providers.environmentVariable('RELEASE_TYPE').getOrElse('ALPHA')

publishMods {
	dryRun = true
	file = remapJar.archiveFile
	modLoaders.add('ornithe')

	modrinth {
		projectId = '9gNVPfzw'
		accessToken = providers.environmentVariable('MODRINTH_TOKEN')
		version = "ornithe-${project.minecraft_version}-${project.version}"
		displayName = "MinecraftCapes Ornithe ${project.minecraft_version}-${project.version}"
		minecraftVersions.add(minecraft_version)
		type = releaseType == 'NO_DEPLOY' ? 'ALPHA' : releaseType
		environment = CLIENT_ONLY
		changelog = ''
	}
}