plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'java'
    id 'io.freefair.lombok' version "9.5.0"
    id 'net.minecraftforge.gradle' version '7.+'
    id 'net.minecraftforge.renamer' version '1.1.7'
}

// These settings allow you to choose what version of Java you want to be compatible with. Forge 1.7.10 runs on Java 6 to 8.
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)
compileJava {
    sourceCompatibility = "8"
    targetCompatibility = "8"
}

base {
    archivesName = "${mod_name} Forge ${minecraft_version}"
}

renamer.enableMixinRefmaps {
    config("${mod_id}.mixins.json")
    refMap = "${mod_id}.refmap.json"
}

minecraft {
    mappings channel: "official", version: "${minecraft_version}"

    runs {
        client {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'debug'
            args('--username=james090500')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {url = "https://repo.spongepowered.org/maven/" }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Minecraft supplies GLFW at runtime; the key binding code also needs its API to compile.
    compileOnly 'org.lwjgl:lwjgl-glfw:3.2.2'

    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Required for Dev
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest.attributes([
            'Specification-Title' : mod_id,
            'Specification-Vendor' : mod_id,
            'Specification-Version' : version
    ])
}

processResources {
    // Fill in data
    def expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "pack_format": pack_format,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "credits": credits,
            "java_version": java_version
    ]

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}
renamer.mappings(minecraft.dependency.toSrg)
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = ''
    mappings renamer.mixin.generatedMappings
}
tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}
// Compile with a modern JDK while retaining Java 8 API and bytecode compatibility.
tasks.withType(JavaCompile).configureEach {
    // Keep compilation independent of Minecraft's Java 8 runtime.
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    options.release = 8
}


def releaseType = providers.environmentVariable('RELEASE_TYPE').getOrElse('ALPHA')

publishMods {
    file = tasks.named('renameJar').flatMap { it.output }
    version = "forge-${minecraft_version}-${version}"
    displayName = "MinecraftCapes Forge ${minecraft_version}-${version}"
    // Jenkins skips publishing for NO_DEPLOY; Gradle still needs a valid enum to configure the build.
    type = releaseType == 'NO_DEPLOY' ? 'ALPHA' : releaseType
    changelog = ''
    modLoaders.add('forge')

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = '359836'
        minecraftVersions.add(minecraft_version)
        client = true
        server = false
        requires('mixinbootstrap')
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = '9gNVPfzw'
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_ONLY
        requires('mixinbootstrap')
    }
}
