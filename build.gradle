plugins {
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
    id 'idea'
    id 'java'
    id 'io.freefair.lombok' version "${lombok_version}"
    id 'net.minecraftforge.gradle' version '7.+'
    id 'net.minecraftforge.renamer' version '1.1.7'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    // Minecraft uses Java 8
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    sourceCompatibility = targetCompatibility = java_version
}

base {
    archivesName = "${mod_name} Forge ${minecraft_version}"
}

// Include generated resources
sourceSets.main.resources.srcDir 'src/generated/resources'

// Libraries that should be bundled into the final mod JAR.
configurations {
    shadowImpl

    implementation.extendsFrom(shadowImpl)
}

repositories {
    minecraft.mavenizer(it)

    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    mavenCentral()

    maven {
        url = "https://repo.spongepowered.org/maven/"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    shadowImpl("org.spongepowered:mixin:0.8.5") {
        transitive = false
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

minecraft {
    mappings channel: 'snapshot', version: '20190530-1.13.2'

    runs {
        client {
            workingDir = layout.projectDirectory.dir('run')

            args "--username=james090500"

            args "-mixin.config=${mod_id}.mixins.json"
        }
        server {
            workingDir = layout.projectDirectory.dir('run')
            args "-mixin.config=${mod_id}.mixins.json"
        }
    }
}

renamer.enableMixinRefmaps {
    config("${mod_id}.mixins.json")
    refMap = "${mod_id}.refmap.json"
}

renamer.mappings(minecraft.dependency.toSrg)

renamer.classes(tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)) {
    archiveClassifier = ''

    mappings renamer.mixin.generatedMappings
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    dependsOn tasks.named('jar')

    from(zipTree(tasks.named('jar').get().archiveFile))

    configurations = [project.configurations.shadowImpl]

    archiveClassifier.set('shadow')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    mergeServiceFiles {
        include 'META-INF/services/*'
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'thin'

    from sourceSets.main.output

    manifest.attributes(
            "Specification-Title": mod_id,
            "Specification-Vendor": mod_id,
            "Specification-Version": version,
            "Implementation-Title": project.name,
            "Implementation-Version": version,
            "Implementation-Vendor": mod_id,
            "FMLCorePluginContainsFMLMod": true,
            "ForceLoadAsMod": true,
            "TweakOrder": 0,
            "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
            "MixinConfigs": "${mod_id}.mixins.json"
    )
}

tasks.named('processResources') {
    def expandProps = [
            version                    : version,
            group                      : project.group,
            minecraft_version          : minecraft_version,
            pack_format                : pack_format,
            mod_name                   : mod_name,
            mod_author                 : mod_author,
            mod_id                     : mod_id,
            license                    : license,
            description                : project.description,
            forge_version              : forge_version,
            forge_loader_version_range : forge_loader_version_range,
            credits                    : credits,
            java_version               : java_version
    ]

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    // Keep compilation independent of Minecraft's Java 8 runtime.
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    options.encoding = 'UTF-8'
}


// Compile with a modern JDK while retaining Java 8 API and bytecode compatibility.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
}


def releaseType = providers.environmentVariable('RELEASE_TYPE').getOrElse('ALPHA')

publishMods {
    file = tasks.named('renameShadowJar').flatMap { it.output }
    version = "forge-${minecraft_version}-${version}"
    displayName = "MinecraftCapes Forge ${minecraft_version}-${version}"
    // Jenkins skips publishing for NO_DEPLOY; Gradle still needs a valid enum to configure the build.
    type = releaseType == 'NO_DEPLOY' ? 'ALPHA' : releaseType
    changelog = ''
    modLoaders.add('forge')

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = '359836'
        minecraftVersions.add(minecraft_version)
        client = true
        server = false
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = '9gNVPfzw'
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_ONLY
    }
}
