plugins {
	id 'java'
	id 'maven-publish'
	id 'fabric-loom' version '1.15-SNAPSHOT' apply false
	id 'ploceus' version '1.15-SNAPSHOT' apply false
	id 'io.freefair.lombok' version "9.2.0" apply false
}

def configure(project) {
	project.apply plugin: 'java'
	project.apply plugin: 'maven-publish'
	project.apply plugin: 'fabric-loom'
	project.apply plugin: 'ploceus'
	project.apply plugin: 'io.freefair.lombok'

	project.base {
		archivesName = "${project.rootProject.mod_name} Ornithe ${project.rootProject.minecraft_version} Gen1"
	}
	project.version = "${project.rootProject.version}"
	project.group = project.rootProject.group

	project.loom {
		if (project.environment == 'client') {
			clientOnlyMinecraftJar()

			runs {
				client {
					client()
					programArgs(["--username", "james090500"])
				}
			}
		}
		if (project.environment == 'server') {
			serverOnlyMinecraftJar()
		}
	}

	project.ploceus {
		if (project.environment == 'client') {
			clientOnlyMappings()
		}
		if (project.environment == 'server') {
			serverOnlyMappings()
		}
	}

	project.repositories {
		if (project.environment == 'client') {
			exclusiveContent {
				forRepository {
					maven {
						name = "Modrinth"
						url = "https://api.modrinth.com/maven"
					}
				}
				filter {
					includeGroup "maven.modrinth"
				}
			}
		}
	}

	project.dependencies {
		minecraft "com.mojang:minecraft:${project.rootProject.minecraft_version}"
		modImplementation "net.fabricmc:fabric-loader:${project.rootProject.loader_version}"

		mappings project.ploceus.featherMappings(project.feather_build)
		exceptions project.ploceus.raven(project.raven_build)
		signatures project.ploceus.sparrow(project.sparrow_build)
		nests project.ploceus.nests(project.nests_build)

		project.ploceus.dependOsl(project.osl_version, project.environment)

		if (project.environment == 'client') {
			// Third party mods
			modImplementation "maven.modrinth:modmenu-ornithe:0.3.1+mcb1.7.3"
			modImplementation "maven.modrinth:legacyauth:1.0.5+Protocol14-Client"
		}
	}

	project.sourceSets {
		main {
			java {
				srcDirs += project.rootProject.sourceSets.main.java.srcDirs
			}
			resources {
				srcDirs += project.rootProject.sourceSets.main.resources.srcDirs
			}
		}
	}

	project.processResources {
		filesMatching('fabric.mod.json') {
			expand project.properties
		}
	}

	project.tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		it.options.release = 8
	}

	project.java {
		// Still required by IDEs such as Eclipse and Visual Studio Code
		sourceCompatibility = JavaVersion.VERSION_1_8
		targetCompatibility = JavaVersion.VERSION_1_8
	}

	// If you plan to use a different file for the license, don't forget to change the file name here!
	project.jar {
		from('LICENSE') {
			rename { "${it}_${project.base.archivesName.get()}" }
		}
	}
}