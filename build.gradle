plugins {
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'ploceus' version '1.17-SNAPSHOT'
	id 'io.freefair.lombok' version "9.2.0"
}

base {
	archivesName = "${mod_name} Ornithe ${minecraft_version}"
}

ploceus {
	setIntermediaryGeneration(2)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)

	ploceus.dependOsl(project.osl_version)
}

loom {
	runs {
		client {
			getProgramArguments().addAll(["--username", "james090500"])
		}
	}
}

processResources {
	def expandProps = [
			"version": version,
			"group": project.group, //Else we target the task's group.
			"minecraft_version": minecraft_version,
			"mod_name": mod_name,
			"mod_author": mod_author,
			"mod_id": mod_id,
			"license": license,
			"description": project.description,
			"credits": credits,
	]

	filesMatching('fabric.mod.json') {
		expand expandProps
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(8)
	sourceCompatibility = targetCompatibility = 8
}

def releaseType = providers.environmentVariable('RELEASE_TYPE').getOrElse('ALPHA')

publishMods {
	dryRun = true
	file = remapJar.archiveFile
	modLoaders.add('ornithe')

	modrinth {
		projectId = '9gNVPfzw'
		accessToken = providers.environmentVariable('MODRINTH_TOKEN')
		version = "ornithe-${project.minecraft_version}-${project.version}"
		displayName = "MinecraftCapes Ornithe ${project.minecraft_version}-${project.version}"
		minecraftVersions.add(minecraft_version)
		type = releaseType == 'NO_DEPLOY' ? 'ALPHA' : releaseType
		environment = CLIENT_ONLY
		changelog = ''
	}
}