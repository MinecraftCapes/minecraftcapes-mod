plugins {
    id 'idea'
    id 'java'
    id 'io.freefair.lombok' version "${lombok_version}"
    id 'net.minecraftforge.gradle' version '7.+'
    id 'net.minecraftforge.renamer' version '1.0.14'
}

// Minecraft uses Java 8
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    sourceCompatibility = targetCompatibility = java_version
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

base {
    archivesName = "${mod_name} Forge ${minecraft_version}"
}

renamer.enableMixinRefmaps {
    config "${mod_id}.mixins.json"
}

renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
    // We need to use the generated mappings, which includes things generated by the annotation processor
    mappings renamer.mixin.generatedMappings
}

minecraft {
    mappings channel: 'stable', version: "12-${minecraft_version}"

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }

        register('client') {
            args "--username=james090500"
            systemProperty("fml.coreMods.load", "net.minecraftcapes.mixin.MixinLoader")
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {url = "https://repo.spongepowered.org/maven/" }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    implementation 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
}
renamer.mappings(minecraft.dependency.toSrg)

tasks.named('jar', Jar) {
    from sourceSets.main.output

    manifest.attributes (
            "FMLCorePlugin": "net.minecraftcapes.mixin.MixinLoader",
            'FMLCorePluginContainsFMLMod': true,
            'ForceLoadAsMod': true,
            "TweakOrder": 0,
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
    )
}

processResources {
    // Fill in data
    def expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "pack_format": pack_format,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "credits": credits,
            "java_version": java_version
    ]

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

afterEvaluate {
    // https://repo.spongepowered.org/repository/maven-public/org/spongepowered/mixin/0.8.3/mixin-0.8.3-processor.jar
    tasks.compileJava {
        // Use the 0.8 AP jar via annotationProcessorPath instead of -processorpath
        def mixinAp = files(projectDir.absolutePath + "/libs/mixin-0.8.3-processor.jar")
        options.annotationProcessorPath = (options.annotationProcessorPath ?: configurations.annotationProcessor) + mixinAp
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}