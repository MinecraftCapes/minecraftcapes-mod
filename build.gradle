plugins {
    id 'io.freefair.lombok' version "8.13.1"
    id 'net.minecraftforge.gradle' version '6.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

// These settings allow you to choose what version of Java you want to be compatible with. Forge 1.7.10 runs on Java 6 to 8.
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
compileJava {
    sourceCompatibility = "8"
    targetCompatibility = "8"
}

base {
    archivesName = "${mod_name} Forge ${minecraft_version}"
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

minecraft {
    mappings channel: "official", version: "${minecraft_version}"

    runs {
        client {
            workingDirectory file('run')
            property 'forge.logging.console.level', 'debug'
            args('--username=james090500')
        }
    }
}

repositories {
    maven {url = "https://repo.spongepowered.org/maven/" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation "org.spongepowered:mixin:0.8.5-SNAPSHOT"
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT'

    // Required for Dev
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest.attributes([
            'Specification-Title' : mod_id,
            'Specification-Vendor' : mod_id,
            'Specification-Version' : version
    ])
}

processResources {
    // Fill in data
    def expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "credits": credits,
            "java_version": java_version
    ]

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}