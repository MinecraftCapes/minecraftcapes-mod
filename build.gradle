buildscript {
    repositories {
        mavenCentral()
        maven { url "https://maven.minecraftforge.net" }
        maven { url 'https://repo.spongepowered.org/maven'}
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

repositories {
    maven {
        url = "https://repo.spongepowered.org/maven/"
    }
}

apply plugin: 'forge'

// These settings allow you to choose what version of Java you want to be compatible with. Forge 1.7.10 runs on Java 6 to 8.
sourceCompatibility = targetCompatibility = 1.8

version = "${project.version}"
group = "net.minecraftcapes" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "${project.mod_name} Forge ${project.minecraft_version}"

minecraft {
    version = project.forge_version

    replace '@MOD_VERSION', project.version
    replace '@MINECRAFT_VERSION', project.minecraft_version
    replaceIn 'MinecraftCapes.java'

    runDir = "run"
    mappings = "stable_12"
}

// This is the configuration for the shadow plugin, which is used to add libraries to the jar.
configurations {
    shade
    shadeClient
    buildDep
    implementation.extendsFrom buildDep, shade, shadeClient
}

dependencies {
    shade group: "org.spongepowered", name: "mixin", version: "0.7.11-SNAPSHOT", changing: true
    shadeClient group: "org.spongepowered", name: "mixin", version: "0.7.11-SNAPSHOT", changing: true

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

def refMap = "${tasks.compileJava.temporaryDir}" + File.separator + "${project.mod_id}.refmap.json"

jar {
    from sourceSets.main.output

    from refMap

    configurations.shade.copyRecursive().setTransitive(false).each { artifact ->
        from (zipTree(artifact))
        exclude 'META-INF/*.RSA'
    }

    manifest.attributes (
            "FMLCorePlugin": "net.minecraftcapes.mixin.MixinLoader",
            'FMLCorePluginContainsFMLMod': true,
            "TweakOrder": 0,
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
    )
}

runClient {
    args("--username=james090500")
}

def mixinSrg = "${tasks.reobf.temporaryDir}" + File.separator + "mixins.srg"

reobf {
    addExtraSrgFile mixinSrg
}

afterEvaluate {
    //https://github.com/TimeConqueror/SpongeMixins/raw/master/mixin-0.8-SNAPSHOT.jar
    tasks.compileJava {
        println "Path: " + projectDir.absolutePath

        // Use the 0.8 AP jar via annotationProcessorPath instead of -processorpath
        def mixinAp = files(projectDir.absolutePath + "/libs/mixin-0.8-SNAPSHOT.jar")
        options.annotationProcessorPath = (options.annotationProcessorPath ?: configurations.annotationProcessor) + mixinAp

        options.compilerArgs += [
                // There's a bug in the AnnotationProcessor for 0.7.11 that will generate the annotations pointing to the parent class instead of subclass
                // resulting in the mixin not being applied.  This is fixed in 0.8, however 0.8 needs guava > 21.0, and minecraft ships with 17.0.
                // So as a hacky workaround... ship with 0.7.11, but use the AP from 0.8 for compiling
                "-Xlint:-sunapi", "-XDenableSunApiLintControl", "-XDignore.symbol.file",
                "-AreobfSrgFile=${tasks.reobf.srg}",
                "-AoutSrgFile=${mixinSrg}",
                "-AoutRefMapFile=${refMap}"
        ]
    }
}

sourceSets {
    main {
        ext.refMap = "${project.mod_id}.refmap.json"
    }
}

processResources {
    var expandProps = [
            "version": version,
            "group": project.group, //Else we target the task's group.
            "minecraft_version": minecraft_version,
            "mod_name": mod_name,
            "mod_author": mod_author,
            "mod_id": mod_id,
            "license": license,
            "description": project.description,
            "forge_version": forge_version,
            "forge_loader_version_range": forge_loader_version_range,
            "credits": credits,
            "java_version": java_version
    ]

    filesMatching(['mcmod.info']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}