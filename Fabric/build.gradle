plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
    id "io.freefair.lombok" version "8.0.1"
}

archivesBaseName = "${mod_name} Fabric ${minecraft_version}"

repositories {
    //Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // Trinkets
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = "https://ladysnake.jfrog.io/artifactory/mods"
    }
}

dependencies {
    //Fabric and Minecraft
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    //Common
    implementation project(":Common")

    //Auth and Mod Menu
    modLocalRuntime "maven.modrinth:sodium:mc1.19.4-0.4.10"

    modLocalRuntime "maven.modrinth:modmenu:7.0.1"
    modLocalRuntime "maven.modrinth:auth-me:7.0.0"
    modLocalRuntime "maven.modrinth:cloth-config:11.0.99+fabric"

    //Libs
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.1.0"
    modCompileOnly "maven.modrinth:armor-visibility:7.0.0-fabric"
    modCompileOnly "dev.emi:trinkets:3.6.0"

}

loom {
    accessWidenerPath = file("src/main/resources/minecraftcapes.accesswidener")

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}


processResources {
    from project(":Common").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}