pluginManagement {
    // when using additional gradle plugins like shadow,
    // add their repositories to this list!
    repositories {
        maven { url "https://repo.essential.gg/public" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin { details ->
            switch (details.requested.id.id) {
                case "gg.essential.loom":
                    details.useModule("gg.essential:architectury-loom:${details.requested.version}")
                    break
            }
        }
    }
}
